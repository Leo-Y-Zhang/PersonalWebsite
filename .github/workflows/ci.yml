name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certificate:
    name: Verify the rendered certificate
    runs-on: ubuntu-latest
    # Measured: this job takes about six seconds. GitHub's default is 360
    # minutes, so an unbounded hang would burn six hours of the account quota
    # before being killed. Ten is a backstop, not a target.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-verify w(14; 2^12, 3, 4) > 56 from index.html
        run: python3 tools/verify_certificate.py
      # The step above shows the verifier accepts the page as published; the
      # tests pin what the page tools must refuse.
      - name: Test the page tools
        run: python3 -m unittest discover -s tests -v
